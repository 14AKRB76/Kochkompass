<style>
/* Layout: eine Spalte wie ein Einkaufszettel am Handy, unten feste Tab-Leiste; Kochansicht als Vollbild-Overlay */
:root {
  --bg: #EEF2EC;
  --surface: #FFFFFF;
  --surface-2: #E3E9E0;
  --ink: #17201A;
  --muted: #56655A;
  --line: #CFD8CB;
  --accent: #D2480F;
  --accent-soft: #FBE3D6;
  --accent-ink: #FFFFFF;
  --green: #2D7A4C;
  --green-soft: #DCEFE2;
  --warn: #9A6410;
  --warn-soft: #F7EBCF;
  --danger: #B42318;
  --fish: #2463A8;
  --meat: #9E3434;
  --shadow: 0 1px 2px rgba(23,32,26,.06), 0 6px 18px rgba(23,32,26,.07);
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1411; --surface: #171E19; --surface-2: #212A23; --ink: #E5ECE3; --muted: #9AA99D; --line: #2D3830;
    --accent: #FF7A3D; --accent-soft: #3A2117; --accent-ink: #1C0D05; --green: #5DC38B; --green-soft: #183223;
    --warn: #E3AD52; --warn-soft: #33280F; --danger: #F07167; --fish: #74A9E6; --meat: #E58080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #171E19; --surface-2: #212A23; --ink: #E5ECE3; --muted: #9AA99D; --line: #2D3830;
  --accent: #FF7A3D; --accent-soft: #3A2117; --accent-ink: #1C0D05; --green: #5DC38B; --green-soft: #183223;
  --warn: #E3AD52; --warn-soft: #33280F; --danger: #F07167; --fish: #74A9E6; --meat: #E58080;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: -.01em; text-wrap: balance; margin: 0; line-height: 1.1; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 30px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* Segment & Chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px 8px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip svg { width: 16px; height: 16px; }

/* Karten */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sugg h3 { font-size: 22px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); align-items: center; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta svg { width: 16px; height: 16px; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.macros div { padding: 6px 4px; text-align: center; border-left: 1.5px solid var(--line); }
.macros div:first-child { border-left: 0; }
.macros b { display: block; font-family: var(--f-display); font-size: 19px; font-variant-numeric: tabular-nums; }
.macros small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.macros .p { background: var(--green-soft); }
.macros .p b { color: var(--green); }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.why li { display: flex; gap: 8px; align-items: baseline; }
.why li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
.why li.g::before { background: var(--green); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 11px; padding: 12px 16px; font-weight: 700; background: var(--surface-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.grow { flex: 1 1 0; }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; border-radius: 9px; }
.btn svg { width: 18px; height: 18px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 6px 0; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.veg { background: var(--green-soft); color: var(--green); }
.tag.fisch { color: var(--fish); }
.tag.fleisch { color: var(--meat); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.hot { background: var(--accent-soft); color: var(--accent); }

/* Fortschritt */
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 99px; }
.bar .zone { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--ink); opacity: .35; }

/* Listen */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .name { font-weight: 700; overflow-wrap: anywhere; }
.li .sub { font-size: 13px; color: var(--muted); }
.check { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.check svg { width: 18px; height: 18px; opacity: 0; color: var(--accent-ink); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-checked="true"] svg { opacity: 1; }
.li.done .name { text-decoration: line-through; color: var(--muted); }
.dept { font-family: var(--f-display); font-weight: 800; font-size: 15px; margin-top: 6px; display: flex; justify-content: space-between; }
.iconbtn { flex: none; border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; padding: 0; color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 10px; }
.stepper button { border: 0; background: none; width: 36px; height: 36px; font-size: 20px; font-weight: 700; }
.stepper b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 19px; }

/* Rezeptliste */
.rlist { display: flex; flex-direction: column; gap: 8px; }
.ritem { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 12px; padding: 12px 14px; border: 0; text-align: left; box-shadow: var(--shadow); width: 100%; }
.ritem .grow { flex: 1; min-width: 0; }
.ritem .name { font-weight: 700; }
.ritem .pbox { flex: none; text-align: center; min-width: 52px; }
.ritem .pbox b { display: block; font-family: var(--f-display); font-size: 20px; color: var(--green); font-variant-numeric: tabular-nums; }
.ritem .pbox small { font-size: 11px; color: var(--muted); font-weight: 700; }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; padding: 4px; color: var(--line); }
.stars button[aria-pressed="true"] { color: var(--accent); }
.stars svg { width: 26px; height: 26px; }

/* Wochenwerte */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; border-left: 5px solid var(--line); }
.stat.ok { border-left-color: var(--green); }
.stat.warn { border-left-color: var(--warn); }
.stat.bad { border-left-color: var(--danger); }
.stat b { font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.day { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.day:first-child { border-top: 0; }
.day .d { font-family: var(--f-display); font-weight: 800; line-height: 1.1; }
.day .d small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); }

/* Navigation */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: none; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }

.ov .wrap { padding-bottom: 130px; }

.ovhead h2 { font-size: 19px; flex: 1; min-width: 0; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.dock .in { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { background: var(--surface); border-radius: var(--r); padding: 16px 16px 16px 58px; position: relative; font-size: 19px; line-height: 1.5; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 14px; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-weight: 800; display: grid; place-items: center; font-size: 17px; }
.steps li.done { opacity: .5; }
.steps li.done::before { background: var(--green); content: "✓"; }
.timerbar { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column-reverse; gap: 6px; align-items: center; pointer-events: none; }
.timer { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 10px 8px 16px; display: flex; gap: 10px; align-items: center; font-weight: 700; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.timer.ring { background: var(--accent); color: var(--accent-ink); animation: pulse 1s infinite; }
.timer button { border: 0; background: rgba(127,127,127,.25); color: inherit; border-radius: 999px; padding: 4px 10px; font-weight: 700; }
@keyframes pulse { 50% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .timer.ring { animation: none; } }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; min-width: 0; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-weight: 400; font-size: 16px; width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 80; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.note { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note.g { background: var(--green-soft); }
.ingtable { display: flex; flex-direction: column; }
.ingtable .li { padding: 9px 0; }
.ingtable .amt { flex: none; width: 92px; font-weight: 700; font-variant-numeric: tabular-nums; }
textarea { resize: vertical; }
details summary { cursor: pointer; font-weight: 700; }
</style>

    FR = out; FRstatus = { n: out.length, bad };
  } catch (e) { FR = []; FRstatus = { err: true }; }
  render();
}
function R(id) { return allRecipes().find(r => r.id === id); }
function nutr(r) {
  if (r.n) return r.n;
  return r.manualN || { kcal: 0, p: 0, c: 0, f: 0 };
}
function lastCooked(id) { let best = null; for (const e of H.entries) if (e.r === id && (!best || e.d > best)) best = e.d; return best; }
function rating(id) { return S.ratings[id] || {}; }

/* ---------- Woche & Ziele ---------- */
function proteinGoal() { const w = Number(S.settings.weight) || 65; return [Math.round(w * 1.6), Math.round(w * 2.0)]; }
function weekEntries(days = 7) { const t = today(); return H.entries.filter(e => { const d = diffDays(e.d, t); return d >= 0 && d < days; }); }
function weekCounts() {
  const mains = weekEntries().filter(e => e.meal === "haupt").map(e => R(e.r)).filter(Boolean);
  const c = { n: mains.length, rot: 0, fleisch: 0, fisch: 0, huelsen: 0, veg: 0 };
  for (const r of mains) {
    if (r.protein === "rot") c.rot++;
    if (r.protein === "rot" || r.protein === "gefluegel") c.fleisch++;
    if (r.protein === "fisch") c.fisch++;
    if (r.protein === "huelsen") c.huelsen++;
    if (isVeg(r)) c.veg++;
  }
  return c;
}
function proteinOn(d) { return H.entries.filter(e => e.d === d).reduce((s, e) => { const r = R(e.r); return s + (r ? nutr(r).p : 0); }, 0); }

/* ---------- Reste ---------- */
function leftoverAmt(k) { return S.leftovers.filter(l => l.k === k).reduce((s, l) => s + l.a, 0); }
function leftoverSoonest(k) { const ls = S.leftovers.filter(l => l.k === k).sort((a, b) => a.until < b.until ? -1 : 1); return ls[0]; }
function needsOf(rec, por) {
  const need = {};
  for (const i of rec.ings) { if (i.opt) continue; need[i.k] = (need[i.k] || 0) + i.a * por / rec.servings; }
  return need;
}

/* ---------- Vorschläge ---------- */
let rerollSeed = 0; const shownBefore = new Set(); let lastShown = [];
function suggest(meal, opt) {
  const t = today();
  const hist = H.entries.slice().sort((a, b) => a.d < b.d ? 1 : -1);
  const lastMains = hist.filter(e => e.meal === meal).slice(0, 2).map(e => R(e.r)).filter(Boolean);
  const wc = weekCounts();
  const training = S.training === t;
  let pool = allRecipes().filter(r => r.meal === meal && !rating(r.id).never);
  if (opt.dev) pool = pool.filter(r => opt.dev === "keins" ? r.devices.length === 0 : r.devices.includes(opt.dev));
  if (opt.quick) pool = pool.filter(r => r.total <= 20);
  const scored = pool.map(r => {
    let score = 0; const why = [];
    const lc = lastCooked(r.id); const since = lc ? diffDays(lc, t) : Infinity;
    if (since < 5) score -= 60;
    let loBonus = 0;
    for (const k of Object.keys(needsOf(r, r.servings))) {
      const lo = leftoverSoonest(k); if (!lo) continue;
      const left = diffDays(t, lo.until); const info = ingInfo(k, r);
      const w = left <= 1 ? 30 : left <= 3 ? 16 : 7; loBonus += w;
      why.push({ t: `Verwertet ${info.name} (${fmtAmt(info, leftoverAmt(k))} übrig${left <= 1 ? ", bald verbrauchen" : ""})`, w: 100 + w, g: true });
    }
    score += Math.min(loBonus, 60);
    if (meal === "haupt") {
      if (r.protein === "rot") { if (wc.rot >= 2) score -= 45; else if (wc.rot >= 1) score -= 12; }
      if ((r.protein === "rot" || r.protein === "gefluegel") && wc.fleisch >= 4) score -= 25;
      if (r.protein === "fisch" && wc.fisch < 2) { score += wc.fisch === 0 ? 16 : 8; why.push({ t: wc.fisch === 0 ? "Diese Woche noch kein Fisch" : "Erst 1× Fisch diese Woche", w: 60 }); }
      if (r.protein === "huelsen" && wc.huelsen < 3) { score += 10; why.push({ t: `Hülsenfrüchte: diese Woche erst ${wc.huelsen}×`, w: 50, g: true }); }
      if (isVeg(r) && wc.n >= 2 && wc.veg / wc.n < 0.5) { score += 7; why.push({ t: "Fleischlos, gut für deine Wochenbilanz", w: 40, g: true }); }
      if (lastMains.some(m => m.protein === r.protein)) score -= 14;
      if (lastMains.length >= 2 && lastMains.every(m => m.cuisine === r.cuisine)) score -= 8;
    }
    if (since === Infinity) { score += 5; why.push({ t: "Hast du noch nie gekocht", w: 10 }); }
    else if (since >= 14) { score += 6; why.push({ t: `Zuletzt vor ${since} Tagen`, w: 15 }); }
    const rt = rating(r.id);
    if (rt.stars) score += (rt.stars - 3) * 6;
    if (rt.fav) { score += 10; why.push({ t: "Einer deiner Favoriten", w: 30 }); }
    const n = nutr(r);
    if (training) {
      if (n.p >= 40) { score += 8; why.push({ t: `${n.p} g Eiweiß für deinen Trainingstag`, w: 45, g: true }); }
      if (n.c >= 70) score += 4;
    } else if (n.p >= 45) { score += 3; why.push({ t: `${n.p} g Eiweiß pro Portion`, w: 20, g: true }); }
    if (r.tags.includes("einfrieren") || r.servings > 1) why.push({ t: `Ergibt ${r.servings} Portionen – Rest für morgen`, w: 5 });
    if (shownBefore.has(r.id)) score -= 30;
    score += pseudo(r.id + rerollSeed + t) * 12;
    why.sort((a, b) => b.w - a.w);
    return { r, score, why: why.slice(0, 3) };
  }).sort((a, b) => b.score - a.score);
  const pick = [];
  for (const s of scored) {
    if (pick.length >= 3) break;
    if (pick.length < 2 && pick.some(p => p.r.protein === s.r.protein) && scored.length > 6) continue;
    pick.push(s);
  }
  for (const s of scored) { if (pick.length >= 3) break; if (!pick.includes(s)) pick.push(s); }
  return pick;
}
function pseudo(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }

/* ---------- Einkaufsliste ---------- */
function shopRows() {
  const need = {}, from = {};
  for (const p of S.plan) {
    const r = R(p.id); if (!r) continue;
    const n = needsOf(r, p.por);
    for (const k in n) { need[k] = (need[k] || 0) + n[k]; (from[k] = from[k] || []).push(r); }
  }
  const rows = [], stock = [];
  for (const k in need) {
    const info = ingInfo(k, from[k][0]);
    if (info.unit === "prise" && S.pantry[k]) { stock.push({ k, info, why: "Vorrat" }); continue; }
    if (info.staple) {
      if (S.pantry[k] && !S.checked[k]) { stock.push({ k, info, why: "Vorrat" }); continue; }
      rows.push({ k, info, staple: true, label: info.packLabel || "", need: need[k] });
      continue;
    }
    const have = leftoverAmt(k);
    const rest = need[k] - have;
    if (rest <= 1e-6 && !S.checked[k]) { stock.push({ k, info, why: "Reste" }); continue; }
    const r = Math.max(rest, 0);
    const packs = Math.max(1, Math.ceil(r / info.pack - 0.1));
    const label = info.custom ? fmtAmt(info, r) : info.unit === "stk" ? (info.pack === 1 ? `${packs} Stk.` : packs > 1 ? `${packs} × ${info.packLabel}` : info.packLabel) : packs > 1 ? `${packs} × ${info.packLabel}` : info.packLabel;
    rows.push({ k, info, label, need: r, have, rec: from[k][0] });
  }
  for (const k of S.stapleShop) {
    if (rows.some(x => x.k === k)) continue;
    if (S.pantry[k] && !S.checked[k]) continue;
    const info = ING[k]; if (!info) continue;
    rows.push({ k, info, staple: true, label: info.packLabel, basis: true });
  }
  return { rows, stock };
}
function openShopCount() { const { rows } = shopRows(); return rows.filter(r => !S.checked[r.k]).length + S.extras.filter(e => !e.done).length; }
function planRecipe(id, por) {
  const r = R(id); if (!r) return;
  por = por || r.servings;
  if (S.settings.shopMode === "heute") { S.plan = [{ id, por }]; S.checked = {}; }
  else if (!S.plan.some(p => p.id === id)) S.plan.push({ id, por });
  save("state");
}

function cookOutcome(r, por) {
  const lo = clone(S.leftovers); const items = []; const t = today();
  const need = needsOf(r, por);
  for (const k in need) {
    const info = ingInfo(k, r); if (info.staple) continue;
    let n = need[k];
    for (const l of lo.filter(l => l.k === k).sort((a, b) => a.until < b.until ? -1 : 1)) { const take = Math.min(l.a, n); l.a -= take; n -= take; if (n <= 1e-6) break; }
    if (n > 1e-6 && !info.custom) {
      const packs = Math.max(1, Math.ceil(n / info.pack - 0.1));
      const rem = packs * info.pack - n;
      const min = info.unit === "stk" ? 0.25 : Math.max(5, info.pack * 0.12);
      if (rem >= min) items.push({ k, a: info.unit === "stk" ? Math.round(rem * 4) / 4 : Math.round(rem), until: addDays(t, info.shelf), on: true });
    }
  }
  return { lo: lo.filter(l => l.meal || l.a > (ingInfo(l.k).unit === "stk" ? 0.1 : 2)), items };
}

const UNIT_ALIASES = { g: "g", gramm: "g", kg: "kg", ml: "ml", l: "l", liter: "l", stk: "stk", "stk.": "stk", stück: "stk", el: "el", tl: "tl", zehe: "zehe", zehen: "zehe", prise: "prise" };
function normName(s) { return s.toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-zäöüß ]/g, " ").replace(/\s+/g, " ").trim(); }
function findIng(name) {
  const n = normName(name); if (!n) return null;
  let best = null;
  for (const k in ING) { const m = normName(ING[k].name); if (m === n) return k; if (!best && (m.startsWith(n) || n.startsWith(m) || m.split(" ").includes(n))) best = k; }
  return best;
}
function parseIngs(text) {
  const out = [];
  for (const raw of text.split("\n")) {
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/^([\d.,½¼¾\/]+)?\s*([a-zA-ZäöüÄÖÜ.]+)?\s+(.*)$/);
    let amt = 1, unit = null, name = line;
    if (m && m[1]) {
      amt = parseFloat(m[1].replace(",", ".").replace("½", ".5").replace("¼", ".25").replace("¾", ".75")) || 1;
      const u = m[2] && UNIT_ALIASES[m[2].toLowerCase()];
      if (u) { unit = u; name = m[3]; } else { name = ((m[2] || "") + " " + m[3]).trim(); }
    }
    if (unit === "kg") { amt *= 1000; unit = "g"; } if (unit === "l") { amt *= 1000; unit = "ml"; }
    const k = findIng(name);
    if (k) {
      const info = ING[k]; let a = amt;
      if (unit && unit !== info.unit) { if ((unit === "g" || unit === "ml") && info.g) a = amt / info.g; else if ((info.unit === "g" || info.unit === "ml") && unit === "stk") a = amt * 100; }
      out.push({ k, a: Math.round(a * 100) / 100 });
    } else out.push({ k: "x:" + name.slice(0, 40), a: amt, u: unit || "stk", name: name.slice(0, 60) });
  }
  return out;
}
function computeN(r) {
  let t = [0, 0, 0, 0], known = true;
  for (const i of r.ings) {
    const info = ING[i.k]; if (!info) { known = false; continue; }
    const raw = DB.nutri && DB.nutri[i.k]; if (!raw) continue;
    const g = i.a * info.g; for (let j = 0; j < 4; j++) t[j] += g * raw[j] / 100;
  }
  const s = r.servings || 1;
  return { n: { kcal: Math.round(t[0] / s), p: Math.round(t[1] / s), c: Math.round(t[2] / s), f: Math.round(t[3] / s) }, known };
}
function openEditor(id) {
  const r = id ? R(id) : null;
  ui.sheet = { type: "editor", draft: r ? {
    id: r.id, name: r.name, meal: r.meal, protein: r.protein, prep: r.prep, total: r.total, servings: r.servings, devices: r.devices.slice(),
    ingText: r.ings.map(i => { const info = ingInfo(i.k, r); return `${fmtAmt(info, i.a)} ${info.name}`; }).join("\n"),
    stepText: r.steps.map(s => s.t).join("\n"), mp: r.manualN ? r.manualN.p : "", mkcal: r.manualN ? r.manualN.kcal : ""
  } : { name: "", meal: "haupt", protein: "huelsen", prep: 15, total: 25, servings: 1, devices: ["herd"], ingText: "", stepText: "" } };
  render();
}
function saveEditor() {
  const d = ui.sheet.draft; const v = id => $("#" + id).value;
  const r = {
    id: d.id || "c-" + rid(), custom: true, name: v("e_name").trim() || "Mein Rezept", meal: v("e_meal"), protein: v("e_prot"),
    prep: parseInt(v("e_prep")) || 15, total: parseInt(v("e_total")) || parseInt(v("e_prep")) || 20, servings: Math.max(1, parseInt(v("e_srv")) || 1),
    devices: d.devices, cuisine: "eigen", tags: [], ings: parseIngs(v("e_ings")),
    steps: v("e_steps").split("\n").map(s => s.trim()).filter(Boolean).map(t => ({ t }))
  };
  const tm = r.steps.map(s => s.t.match(/(\d+)\s*Min/i)); r.steps.forEach((s, i) => { if (tm[i]) s.timer = parseInt(tm[i][1]); });
  const c = computeN(r);
  const mp = parseInt(v("e_p")), mk = parseInt(v("e_kcal"));
  if (mp || mk || !c.known) { r.manualN = { kcal: mk || c.n.kcal, p: mp || c.n.p, c: c.n.c, f: c.n.f }; } else r.n = c.n;
  if (r.manualN && !mp && !mk) r.n = c.n;
  const idx = C.recipes.findIndex(x => x.id === r.id);
  if (idx >= 0) C.recipes[idx] = r; else C.recipes.push(r);
  save("custom"); ui.sheet = { type: "detail", id: r.id }; toast("Rezept gespeichert"); render();
}

/* ---------- Timer ---------- */
const timers = []; let audioCtx = null;
function startTimer(label, min) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  timers.push({ id: rid(), label, end: Date.now() + min * 60000, ring: false });
  renderTimers();
}
function beep() {
  if (!audioCtx) return;
  try { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(audioCtx.currentTime + 0.35); } catch (e) { }
}
function renderTimers() {
  const el = $("#timers");
  el.innerHTML = timers.map(t => { const left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
    return `<div class="timer ${t.ring ? "ring" : ""}">${svg("timer", 'style="width:18px;height:18px"')}<span>${t.ring ? "Fertig: " : ""}${esc(t.label)}${t.ring ? "" : ` · ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`}</span><button data-act="timeroff" data-id="${t.id}">${t.ring ? "OK" : "Stopp"}</button></div>`; }).join("");
}
setInterval(() => {
  if (!timers.length) return;
  for (const t of timers) if (!t.ring && Date.now() >= t.end) { t.ring = true; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { } }
  if (timers.some(t => t.ring)) beep();
  renderTimers();
}, 1000);
let wakeLock = null;
async function keepAwake(on) {
  try { if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { }
}
document.addEventListener("visibilitychange", () => { if (cook && document.visibilityState === "visible") keepAwake(true); });

/* ---------- Aktionen ---------- */
let toastT;
function toast(msg) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2400); }
function addLeftover(k, a, until) {
  const ex = S.leftovers.find(l => l.k === k);
  if (ex) { ex.a += a; if (until < ex.until) ex.until = until; } else S.leftovers.push({ id: rid(), k, a, until });
}
function openCook(id, por) {
  const r = R(id); if (!r) return;
  cook = { id, por: por || (S.plan.find(p => p.id === id) || {}).por || r.servings, got: new Set(), done: new Set() };
  ui.sheet = null; keepAwake(true); render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, d = Number(b.dataset.d || 0);
  const t = today();
  switch (act) {
    case "tab": ui.tab = id; ui.sheet = null; history.replaceState(null, "", "#" + id); render(); window.scrollTo(0, 0); break;
    case "meal": ui.meal = id; shownBefore.clear(); render(); break;
    case "training": S.training = S.training === t ? null : t; save("state"); render(); break;
    case "quick": ui.quick = !ui.quick; render(); break;
    case "dev": ui.dev = id || null; render(); break;
    case "reroll": lastShown.forEach(x => shownBefore.add(x)); rerollSeed++; render(); window.scrollTo(0, 0); break;
    case "plan": planRecipe(id, Number(b.dataset.por) || undefined); ui.sheet = null; toast(S.settings.shopMode === "heute" ? "Einkaufsliste erstellt" : "Zur Einkaufsliste hinzugefügt");
      if (S.settings.shopMode === "heute") { ui.tab = "einkauf"; history.replaceState(null, "", "#einkauf"); } render(); window.scrollTo(0, 0); break;
    case "cook": openCook(id, Number(b.dataset.por) || undefined); break;
    case "detail": ui.sheet = { type: "detail", id }; render(); break;
    case "close": ui.sheet = null; render(); break;
    case "detpor": ui.sheet.por = Math.max(1, (ui.sheet.por || R(ui.sheet.id).servings) + d); render(); break;
    case "shopmode": S.settings.shopMode = id; if (id === "heute" && S.plan.length > 1) S.plan = S.plan.slice(-1); save("state"); render(); break;
    case "planpor": { const p = S.plan.find(p => p.id === id); if (p) { p.por = Math.max(1, p.por + d); save("state"); render(); } break; }
    case "unplan": S.plan = S.plan.filter(p => p.id !== id); save("state"); render(); break;
    case "check": { if (S.checked[id]) delete S.checked[id]; else { S.checked[id] = true; if (ING[id] && ING[id].staple) { S.pantry[id] = true; S.stapleShop = S.stapleShop.filter(k => k !== id); } } save("state"); render(); break; }
    case "havehome": { const info = ingInfo(id); if (info.staple) { S.pantry[id] = true; S.stapleShop = S.stapleShop.filter(k => k !== id); }
      else { const row = shopRows().rows.find(r => r.k === id); addLeftover(id, row ? row.need : info.pack, addDays(t, Math.min(info.shelf, 5))); }
      save("state"); toast(`${info.name}: als vorhanden gemerkt`); render(); break; }
    case "shopdone": for (const k in S.checked) delete S.checked[k]; S.extras = S.extras.filter(x => !x.done); save("state"); render(); break;
    case "xcheck": { const x = S.extras.find(x => x.id === id); if (x) x.done = !x.done; save("state"); render(); break; }
    case "xdel": S.extras = S.extras.filter(x => x.id !== id); save("state"); render(); break;
    case "basis": { const add = Object.keys(ING).filter(k => ING[k].staple && !S.pantry[k] && allRecipes().filter(r => r.ings.some(i => i.k === k)).length >= 3); S.stapleShop = Array.from(new Set(S.stapleShop.concat(add))); save("state"); render(); break; }
    case "pantry": if (S.pantry[id]) delete S.pantry[id]; else S.pantry[id] = true; save("state"); render(); break;
    case "lodel": S.leftovers = S.leftovers.filter(l => l.id !== id); save("state"); render(); break;
    case "lohalf": { const l = S.leftovers.find(l => l.id === id); if (l) { const info = ingInfo(l.k); l.a = info.unit === "stk" ? Math.round(l.a / 2 * 4) / 4 : Math.round(l.a / 2); if (l.a <= 0) S.leftovers = S.leftovers.filter(x => x !== l); } save("state"); render(); break; }
    case "eatleft": { const l = S.leftovers.find(l => l.id === id); if (!l) break; const r = R(l.meal);
      H.entries.push({ id: rid(), d: t, r: l.meal, meal: r ? r.meal : "haupt", por: 1, left: true }); l.por--; if (l.por <= 0) S.leftovers = S.leftovers.filter(x => x !== l);
      save("state", "history"); toast("Eingetragen. Guten Appetit!"); render(); break; }
    case "filter": ui.filter = ui.filter === id ? null : id; render(); break;
    case "rate": { const rt = S.ratings[id] = S.ratings[id] || {}; rt.stars = rt.stars === d ? 0 : d; save("state"); render(); break; }
    case "fav": { const rt = S.ratings[id] = S.ratings[id] || {}; rt.fav = !rt.fav; save("state"); render(); break; }
    case "never": { const rt = S.ratings[id] = S.ratings[id] || {}; rt.never = !rt.never; save("state"); toast(rt.never ? "Wird nicht mehr vorgeschlagen" : "Wird wieder vorgeschlagen"); render(); break; }
    case "newrecipe": openEditor(null); break;
    case "editrecipe": openEditor(id); break;
    case "edev": { const dv = ui.sheet.draft.devices; const i = dv.indexOf(id); if (i >= 0) dv.splice(i, 1); else dv.push(id); b.setAttribute("aria-pressed", i < 0); break; }
    case "delrecipe": if (b.dataset.confirm) { C.recipes = C.recipes.filter(r => r.id !== id); S.plan = S.plan.filter(p => p.id !== id); save("custom", "state"); ui.sheet = null; toast("Rezept gelöscht"); render(); }
      else { b.dataset.confirm = "1"; b.innerHTML = "Wirklich löschen?"; } break;
    case "cookclose": cook = null; keepAwake(false); render(); break;
    case "cookpor": cook.por = Math.max(1, cook.por + d); render(); break;
    case "cookgot": { const i = Number(id); cook.got.has(i) ? cook.got.delete(i) : cook.got.add(i); render(); break; }
    case "stepdone": { const i = Number(id); cook.done.has(i) ? cook.done.delete(i) : cook.done.add(i); render(); break; }
    case "timer": { const r = R(cook.id); const s = r.steps[Number(id)]; startTimer(`Schritt ${Number(id) + 1}`, s.timer); toast(`Timer läuft: ${s.timer} Min.`); break; }
    case "timeroff": { const i = timers.findIndex(x => x.id === id); if (i >= 0) timers.splice(i, 1); renderTimers(); break; }
    case "finish": { const r = R(cook.id); const o = cookOutcome(r, cook.por); ui.sheet = { type: "finish", id: cook.id, por: cook.por, left: cook.por - 1, stars: rating(cook.id).stars || 0, items: o.items, lo: o.lo }; const keep = cook; cook = null; ui.sheet.cook = keep; keepAwake(false); render(); window.scrollTo(0, 0); break; }
    case "finishback": cook = ui.sheet.cook; ui.sheet = null; keepAwake(true); render(); break;
    case "frate": ui.sheet.stars = ui.sheet.stars === d ? 0 : d; render(); break;
    case "fleft": ui.sheet.left = Math.min(ui.sheet.por - 1, Math.max(0, ui.sheet.left + d)); render(); break;
    case "fitem": { const it = ui.sheet.items[Number(id)]; it.on = !it.on; render(); break; }
    case "finishsave": {
      const f = ui.sheet; const r = R(f.id);
      S.leftovers = f.lo;
      for (const it of f.items) if (it.on) addLeftover(it.k, it.a, it.until);
      if (f.left > 0) S.leftovers.push({ id: rid(), meal: f.id, por: f.left, until: addDays(t, 3) });
      H.entries.push({ id: rid(), d: t, r: f.id, meal: r.meal, por: f.por });
      if (f.stars) { (S.ratings[f.id] = S.ratings[f.id] || {}).stars = f.stars; }
      S.plan = S.plan.filter(p => p.id !== f.id);
      const still = new Set(shopRows().rows.map(x => x.k)); for (const k in S.checked) if (!still.has(k)) delete S.checked[k];
      ui.sheet = null; ui.tab = "heute"; history.replaceState(null, "", "#heute");
      save("state", "history"); toast("Eingetragen. Guten Appetit!"); render(); window.scrollTo(0, 0); break; }
    case "hdel": H.entries = H.entries.filter(x => x.id !== id); save("history"); render(); break;
    case "export": { const txt = JSON.stringify({ kochkompass: 1, state: S, history: H, custom: C });
      const ok = () => toast("Kopiert. Füge es z. B. in eine Notiz ein.");
      try { navigator.clipboard.writeText(txt).then(ok, () => { $("#importtxt").value = txt; $("#importtxt").select(); toast("Text markiert – jetzt kopieren"); }); } catch (err) { $("#importtxt").value = txt; $("#importtxt").select(); } break; }
    case "import": { try { const o = JSON.parse($("#importtxt").value); if (!o.kochkompass) throw 0; applyDoc("state", o.state); applyDoc("history", o.history); applyDoc("custom", o.custom); save("state", "history", "custom"); toast("Sicherung wiederhergestellt"); render(); } catch (err) { toast("Das ist keine gültige Sicherung."); } break; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { ui.q = e.target.value; renderRecipeList(); }
  if (e.target.id === "weight") { const w = parseFloat(e.target.value.replace(",", ".")); if (w > 30 && w < 250) { S.settings.weight = w; save("state"); } }
});
document.addEventListener("change", e => { if (e.target.id === "weight") render(); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "xform") { const v = $("#xtext").value.trim(); if (v) { S.extras.push({ id: rid(), t: v.slice(0, 80), done: false }); save("state"); render(); } }
  if (e.target.id === "loform") {
    const name = $("#loname").value.trim(); const a = parseFloat(($("#loamt").value || "").replace(",", "."));
    const k = Object.keys(ING).find(k => ING[k].name.toLowerCase() === name.toLowerCase()) || findIng(name);
    if (!k) { $("#lohint").textContent = "Diese Zutat kenne ich nicht. Wähl eine aus der Vorschlagsliste."; return; }
    const info = ING[k]; const amt = a > 0 ? a : info.pack;
    addLeftover(k, amt, addDays(today(), Math.min(info.shelf, 5))); save("state"); toast(`${info.name} gemerkt`); render();
  }
  if (e.target.id === "editor") saveEditor();
});

/* ---------- Start ---------- */
(function boot() {
  for (const name of Object.keys(docs)) { const d = lsGet(name); if (d) applyDoc(name, d); }
  const t = today();
  S.leftovers = S.leftovers.filter(l => diffDays(t, l.until) > -3);
  render();
  if (window.claude) initCloud(); else setTimeout(initCloud, 600);
  loadFileRecipes();
})();
</script>
